<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>样片筛选</title>
<style>
  :root {
    --bg: hsl(0 0% 99%);
    --fg: hsl(0 0% 9%);
    --muted: hsl(0 0% 46%);
    --line: hsl(0 0% 90%);
    --hover: hsl(0 0% 9% / 0.03);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  header { display: flex; align-items: baseline; gap: 12px; padding: 24px 24px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; }
  .meta { font-size: 12px; color: var(--muted); }

  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 16px; padding: 24px 24px 96px; }
  .cell { padding: 4px; border-radius: 8px; cursor: pointer; user-select: none; }
  .cell:hover { background: var(--hover); }
  .frame { position: relative; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #fff; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .cell.on .frame { outline: 2px solid var(--fg); outline-offset: 2px; }
  .row { display: flex; align-items: baseline; gap: 8px; padding-top: 8px; }
  .no { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cell.on .no { color: var(--fg); }
  .note { flex: 1; min-width: 0; }
  .link { padding: 0; border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
  .link:hover { color: var(--fg); }

  footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--bg); }
  #picked { white-space: nowrap; color: var(--muted); }
  #picked.on { color: var(--fg); }
  #remark { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
  #remark:focus { outline: none; border-color: var(--muted); }
  .btn { padding: 8px 12px; border: 1px solid var(--fg); border-radius: 6px; background: var(--fg); color: var(--bg); font-family: inherit; font-size: 0.78rem; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .btn:disabled { opacity: 0.35; cursor: default; }

  #big { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: hsl(0 0% 9% / 0.6); }
  #big.on { display: flex; }
  #big .stage { width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 8px 24px hsl(0 0% 0% / 0.2); }
  #big iframe { width: 100%; height: 100%; border: 0; display: block; }
  #big .bar { display: flex; align-items: center; gap: 12px; width: min(100%, calc((100vh - 120px) * 16 / 9)); color: hsl(0 0% 99%); }
  #big .bar .note { flex: 1; }
  #big .link { color: hsl(0 0% 80%); }
  #big .link:hover { color: hsl(0 0% 99%); }
  #big .btn { border-color: hsl(0 0% 99%); background: hsl(0 0% 99%); color: var(--fg); }

  @media (max-width: 960px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) {
    header { padding: 16px; }
    main { grid-template-columns: 1fr; padding: 16px 16px 152px; }
    footer { flex-wrap: wrap; padding: 12px 16px; }
    #remark { flex-basis: 100%; order: 3; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">样片筛选</h1>
  <span class="meta" id="hint"></span>
</header>
<main id="grid"></main>
<footer>
  <span id="picked">未选</span>
  <input id="remark" placeholder="要改的地方（可不填）">
  <button class="btn" id="copy" disabled>复制我的选择</button>
</footer>
<div id="big">
  <div class="stage"></div>
  <div class="bar">
    <span class="no"></span><span class="note"></span>
    <button class="btn" id="bigPick">选这个</button>
    <button class="link" id="bigClose">关闭</button>
  </div>
</div>
<script>
// Agent 只改这两处：页面标题，和每个样片的编号、文件路径（相对本页）、一句话说明。
const TITLE = "样片筛选";
const SAMPLES = [
  // { no: "01", file: "样片/01.html", note: "等距流程：卡片沿传送带依次点亮" },
];

const $ = (s) => document.querySelector(s);
let picked = null;
let bigNo = null;

document.title = TITLE;
$("#title").textContent = TITLE;
$("#hint").textContent = SAMPLES.length
  ? `${SAMPLES.length} 个样片 · 点一下选中，双击放大`
  : "还没有样片：在 SAMPLES 里填编号、文件路径和说明";

for (const s of SAMPLES) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.no = s.no;
  cell.innerHTML = `
    <div class="frame"><iframe loading="lazy" src="${encodeURI(s.file)}" title="样片 ${s.no}"></iframe></div>
    <div class="row"><span class="no">${s.no}</span><span class="note"></span><button class="link">放大</button></div>`;
  cell.querySelector(".note").textContent = s.note || "";
  cell.addEventListener("click", (e) => {
    if (e.target.closest(".link")) return openBig(s.no);
    pick(picked === s.no ? null : s.no);
  });
  cell.addEventListener("dblclick", () => { pick(s.no); openBig(s.no); });
  $("#grid").append(cell);
}

function pick(no) {
  picked = no;
  document.querySelectorAll(".cell").forEach((c) => c.classList.toggle("on", c.dataset.no === no));
  $("#picked").textContent = no ? `已选 ${no}` : "未选";
  $("#picked").classList.toggle("on", !!no);
  $("#copy").disabled = !no;
}

function openBig(no) {
  const s = SAMPLES.find((x) => x.no === no);
  bigNo = no;
  $("#big .stage").innerHTML = `<iframe src="${encodeURI(s.file)}" title="样片 ${s.no}"></iframe>`;
  $("#big .no").textContent = s.no;
  $("#big .note").textContent = s.note || "";
  $("#big").classList.add("on");
}

function closeBig() {
  $("#big").classList.remove("on");
  $("#big .stage").innerHTML = "";
  bigNo = null;
}

$("#bigPick").addEventListener("click", () => { pick(bigNo); closeBig(); });
$("#bigClose").addEventListener("click", closeBig);
$("#big").addEventListener("click", (e) => { if (e.target.id === "big") closeBig(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeBig(); });

$("#copy").addEventListener("click", async () => {
  const remark = $("#remark").value.trim();
  const text = `我选 ${picked}` + (remark ? `：${remark}` : "");
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  $("#copy").textContent = "已复制，发给 Agent";
  setTimeout(() => { $("#copy").textContent = "复制我的选择"; }, 1800);
});
</script>
</body>
</html>
